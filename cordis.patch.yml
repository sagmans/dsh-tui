# Terminal surface over dsh-base. Host parity rows mirror Web's shared backend
# plane; browser transport and React client rows stay absent.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: hmr
  disabled: true

- id: session-query-sqlite
  config:
    path: ':memory:'
    openAt: never

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# Presets own model-facing tools and prompts so each session gets one coherent agent plane.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-str-replace-editor
  disabled: true

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-goal
  disabled: true

- id: plan-mode
  disabled: true

- id: compaction-basic
  disabled: true

- id: command-compact
  disabled: true

- id: tool-result-pruner
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: workflow-worker-thread
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-ralph
  disabled: true

- id: agent-instructions
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-web
  disabled: true

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'

    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: standard

    - id: tui-startup
      name: '@sagmans/dsh-tui/startup'

    - id: tui-client
      name: '@sagmans/dsh-tui/service/client'
      inject: [tuiStartup, apiProxy, typertGateway]

    - id: tui-kernel
      name: '@sagmans/dsh-tui'
      inject: [tuiStartup, tuiClient]

    - id: tui-shell
      name: '@sagmans/dsh-tui/feature/shell'
      inject: [tuiKernel]

    - id: tui-sessions
      name: '@sagmans/dsh-tui/feature/sessions'
      inject: [tuiKernel, tuiClient]

    - id: tui-model-selection
      name: '@sagmans/dsh-tui/feature/model-selection'
      inject: [tuiKernel, tuiClient]

    - id: tui-input-trigger
      name: '@sagmans/dsh-tui/feature/input-trigger'
      inject: [tuiClient]

    - id: tui-conversation
      name: '@sagmans/dsh-tui/feature/conversation'
      inject: [tuiKernel, tuiClient, apiProxy, tuiModelSelection, tuiInputTrigger]

    - id: tui-tools
      name: '@sagmans/dsh-tui/feature/tools'
      inject: [tuiKernel, tuiClient]

    - id: tui-interactions
      name: '@sagmans/dsh-tui/feature/interactions'
      inject: [tuiKernel, tuiClient]

    - id: tui-trajectory
      name: '@sagmans/dsh-tui/feature/trajectory'
      inject: [tuiKernel, tuiClient]

    - id: tui-operations
      name: '@sagmans/dsh-tui/feature/operations'
      inject: [tuiKernel, tuiClient, tuiTrajectory]

    - id: tui-settings
      name: '@sagmans/dsh-tui/feature/settings'
      inject: [tuiKernel, tuiClient]
