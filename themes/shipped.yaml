# shipped — every element at the shade the surface ships.
#
# This is the table everything else is a layer over, written out in full: a
# copy of it is a complete theme, and anything a theme of your own leaves out
# keeps the value here. Values name a palette entry wherever they can, so
# moving one shade moves every element that follows it.

palette:
  default: '#d0d0d0'
  muted: '#8a8a8a'
  faint: '#666666'
  accent: '#5fafd7'
  arg: '#8db3d9'
  warn: '#d7af5f'
  added: '#5faf5f'
  removed: '#d75f5f'
  user: '#27f5c8'
  assistant: '#d0d0d0'

tokens:
  # A row of the conversation.
  transcript.user: { fg: user }
  transcript.notice: { fg: muted }
  transcript.marker: { fg: muted }
  transcript.reasoning.summary: { fg: faint, italic: true }
  transcript.reasoning.body: { fg: faint }
  transcript.reasoning.hint: { fg: faint, italic: true }
  # A tool card, drawn in layers: every card, then one kind of card.
  tool.title: { fg: warn }
  tool.glyph: { fg: warn }
  tool.args: { fg: arg }
  tool.stat.added: { fg: added }
  tool.stat.changed: { fg: warn }
  tool.stat.removed: { fg: removed }
  tool.stat.size: { fg: muted }
  tool.stat.separator: { fg: muted }
  tool.detail: { fg: muted }
  tool.hint: { fg: muted }
  tool.failed.title: { fg: removed }
  tool.failed.glyph: { fg: removed }
  tool.subcall.title: { fg: muted }
  tool.subcall.args: { fg: arg }
  tool.diff.header: { fg: muted }
  tool.diff.hunk: { fg: muted }
  tool.diff.added: { fg: added }
  tool.diff.removed: { fg: removed }
  tool.read.header: { fg: muted }
  tool.read.lineNumber: { fg: muted }
  tool.read.line: { fg: muted }
  tool.search.path: { fg: muted }
  tool.search.lineNumber: { fg: muted }
  tool.search.match: { fg: muted }
  tool.search.truncated: { fg: muted }
  tool.terminal.cwd: { fg: muted }
  tool.terminal.status: { fg: muted }
  tool.terminal.output: { fg: muted }
  tool.web.url: { fg: muted }
  tool.web.source: { fg: muted }
  tool.web.truncated: { fg: muted }
  tool.generic.detail: { fg: muted }
  # A reply, which is markdown, and the diagrams in it.
  markdown.heading: { fg: accent, bold: true }
  markdown.link: { fg: accent, underline: true }
  markdown.linkUrl: { fg: muted }
  markdown.code: { fg: accent }
  markdown.codeBlock: {}
  markdown.codeBlockBorder: { fg: muted }
  markdown.quote: { fg: muted }
  markdown.quoteBorder: { fg: muted }
  markdown.hr: { fg: muted }
  markdown.listBullet: { fg: accent }
  markdown.bold: { bold: true }
  markdown.italic: { italic: true }
  markdown.strikethrough: { strike: true }
  markdown.underline: { underline: true }
  markdown.diagram.border: { fg: muted }
  markdown.diagram.text: {}
  markdown.diagram.edge: { fg: accent }
  markdown.diagram.edgeLabel: { fg: muted }
  markdown.diagram.title: { fg: accent, bold: true }
  markdown.diagram.warning: { fg: warn }
  # A list drawn over the transcript.
  picker.title: { bold: true }
  picker.glyph: { bold: true }
  picker.note: { bold: true }
  picker.filter: { fg: muted }
  picker.row: {}
  picker.rowCurrent: { bold: true }
  picker.scrollNewer: { fg: muted }
  picker.scrollOlder: { fg: muted }
  picker.hint: { fg: muted }
  picker.cursor: {}
  picker.border: { fg: muted }
  # A question or an approval, which stops the turn until it is answered.
  gate.title: { bold: true }
  gate.glyphApproval: { bold: true }
  gate.glyphQuestion: { bold: true }
  gate.detail: { fg: muted }
  gate.option: {}
  gate.optionCurrent: { bold: true }
  gate.cursor: {}
  gate.hint: { fg: muted }
  # The work panel above the editor.
  dock.goal: { bold: true }
  dock.planMode: { bold: true }
  dock.todos.heading: { bold: true }
  dock.todos.pending: { fg: muted }
  dock.todos.inProgress: { fg: muted }
  dock.todos.overflow: { fg: muted }
  dock.subagents.heading: { bold: true }
  dock.subagents.running: { fg: muted }
  dock.subagents.overflow: { fg: muted }
  dock.jobs.heading: { bold: true }
  dock.jobs.running: { fg: muted }
  dock.jobs.overflow: { fg: muted }
  # The footer.
  status.prefix: { fg: accent }
  status.back: { fg: accent }
  status.activity.working: { fg: muted }
  status.activity.ready: { fg: muted }
  status.elapsed: { fg: muted }
  status.agentPreset: { fg: muted }
  status.model: { fg: muted }
  status.effort: { fg: muted }
  status.permission: { fg: muted }
  status.context: { fg: muted }
  status.cache: { fg: muted }
  status.stash: { fg: accent }
  status.cwd: { fg: muted }
  status.separator: { fg: muted }
  # The prompt bar.
  editor.border: { fg: muted }
  editor.queued: { dim: true, italic: true }
  editor.queued.more: { fg: muted }
  editor.ghost: { dim: true }
  editor.selectList.selectedPrefix: { fg: accent }
  editor.selectList.selectedText: { bold: true }
  editor.selectList.description: { fg: muted }
  editor.selectList.scrollInfo: { fg: muted }
  editor.selectList.noMatch: { fg: muted }
