#
# Only reviewed packages may run install or build scripts: exact names, no
# globs. Any other package with a build script fails the install instead of
# being skipped silently.
allowBuilds:
  # The PTY dogfood harness needs node-pty's native addon (node-pty is pinned
  # to an exact version in package.json).
  node-pty: true
strictDepBuilds: true
#
# Security floors for transitive dependencies. Each entry only matches the
# vulnerable range, so a release that already ships the fix resolves untouched
# and the entry can be dropped then.
#   GHSA-698v-4r3x-3vcv, GHSA-r825-w8mm-5pxw, GHSA-587h-7wmj-h5pm  vite (bundled launch-editor)
overrides:
  'vite@<8.3.3': ^8.3.3
