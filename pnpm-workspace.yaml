packages:
  - .

minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  # Exact inspected Harness runtime closure predates this profile integration.
  - '@deepseek-ai/cordis@4.0.1'
  - '@deepseek-ai/cosmokit@1.8.2'
  # Patched Nano ID release is six days old; vulnerable predecessor is blocked.
  - 'nanoid@3.3.18'

overrides:
  # OpenTUI 0.5.1 pins a vulnerable Markdown parser release.
  marked: '17.0.5'
  # Vitest's PostCSS closure otherwise resolves a known denial-of-service release.
  nanoid: '3.3.18'

allowBuilds:
  '*': false
