# Supply-chain policy for this repository.
#
# pnpm blocks a dependency's install/build script until it is reviewed here.
allowBuilds:
  # The PTY dogfood harness needs node-pty's native addon.
  node-pty: true

# Allow consumed harness releases to install before the general release-age window elapses.
# The dsh wildcard covers every matching version, not just the pinned release;
# the Cordis entries are version-specific. Neither scope proves release safety.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-*'
  - '@deepseek-ai/cordis@4.0.2'
  # Keep this Cordis exception version-specific rather than exempting future releases.
  - '@deepseek-ai/cordis@4.0.4'
