peerDependencyRules:
  allowedVersions:
    # Keymap's React adapter is unused; Harness runtime owns React 18 transitively.
    react: '18.3.1'

overrides:
  # OpenTUI 0.5.1 pins a vulnerable Markdown parser release.
  marked: '17.0.5'
  # Vitest's PostCSS closure otherwise resolves a known denial-of-service release.
  nanoid: '3.3.18'

allowBuilds:
  '*': false
  # Native picker falls back to compile only when signed prebuild is unavailable.
  koffi: true
