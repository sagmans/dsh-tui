#
# Only reviewed packages may run install or build scripts: exact names, no
# globs. Any other package with a build script fails the install instead of
# being skipped silently.
allowBuilds:
  # The PTY dogfood harness needs node-pty's native addon (node-pty is pinned
  # to an exact version in package.json).
  node-pty: true
strictDepBuilds: true
#
# Security floors for transitive dependencies the harness pulls in. Each entry
# only matches the vulnerable range, so a harness release that already ships the
# fix resolves untouched and the entry can be dropped then. These floors reach
# this repository's installs only: a consumer of the published bundle resolves
# the harness's own pins.
#   GHSA-mrhx-c7xc-m3w5  zod (harness 0.2.2-rc.5 pins the fixed 4.6.6; the floor
#   still guards other zod consumers)
overrides:
  'zod@>=4.0.0 <4.6.6': ^4.6.7
