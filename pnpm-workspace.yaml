# Supply-chain policy for this repository.
# Newly resolved releases stay out for their first week (minutes). The only
# exceptions are the exact versions listed below.
minimumReleaseAge: 10080
# TEMPORARY, owner-approved exception. Remove this whole list after
# 2026-10-24 08:37 UTC, when every entry has aged past the window above.
# Why: the harness moved its `latest` to 0.2.1-rc.2, and a build mounted against
# one harness release disables the other release's tool presentation, so PTC
# result cards lose their titles on a mismatched host. Mounting the release the
# hosts now run cannot wait for the window. Each entry names one exact version
# (no scope globs), so only the 0.2.1-rc.2 harness set and the five other
# @deepseek-ai libraries it pulls in skip the age check; any other version of
# these packages, and every other package, still waits out the full week.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.5'
  - '@deepseek-ai/cordis-plugin-include@1.0.10'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
