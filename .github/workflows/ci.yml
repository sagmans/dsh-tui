name: verify

# Check proposed changes and merged candidates without granting source-write authority.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Later verification steps need source, not reusable Git credentials.
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          # Keep installation on the same pnpm major as release verification.
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Exercise the supported consumer major; this does not pin the exact >=22.19 floor.
          node-version: '22'
          # Reuse dependency downloads without relaxing the frozen-lockfile gate.
          cache: pnpm
      # Fail on resolution drift rather than verify dependencies absent from the reviewed lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile
      # Check registry signature and attestation evidence before later release gates;
      # this is not proof that every dependency is signed or install scripts were disabled.
      - name: Dependency signatures
        run: npm audit signatures
      # Static contracts and exercised behavior catch different classes of regressions.
      - name: Typecheck
        run: pnpm typecheck
      - name: Golden frames
        run: pnpm test:golden
      # Check the packed consumer artefact, not just source: required exports and assets must survive packaging.
      - name: Package smoke
        run: node tools/pack-smoke.mjs
      # Timing varies across hosts; only key preservation, redraw and restore invariants gate shared runners.
      - name: Native terminal behavior
        run: pnpm test:terminal
      # Real profile checks reuse the verified host release; no global installation or credentials.
      - name: Install dogfood host
        run: |
          version="$(node -p 'Object.keys(require("./package.json").dsh.compatibility.dshReleases)[0]')"
          npm install --prefix "$RUNNER_TEMP/dsh-dogfood-host" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@$version"
          npm audit signatures --prefix "$RUNNER_TEMP/dsh-dogfood-host"
      - name: Free actual-profile dogfood
        run: pnpm dogfood --launcher "$RUNNER_TEMP/dsh-dogfood-host/node_modules/.bin/dsh"
      # The manifest and the tree it describes must name the same harness
      # release; the registry half of this check runs on schedule.
      - name: Harness matrix
        run: node tools/harness-matrix.mjs
      # Resolution failures happen in the consumer's tree, not this one: install
      # the packed artefact with npm and as a plugin profile inside the image a
      # consumer is most likely to have.
      - name: Consumer install smoke
        run: node tools/install-smoke.mjs
