name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Registry signatures and publish attestations for the whole tree: an
      # unsigned or tampered dependency fails here, before anything ships.
      - name: Dependency signatures
        run: npm audit signatures
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and golden tests
        run: pnpm test
      # The release guard suite runs on every change because a regression here
      # would first surface as an unrecoverable registry write.
      - name: Release helper tests
        run: pnpm test:release
      # The PTY harness is a development tool: CI proves the artefact packs and
      # its modules parse, and leaves terminal behaviour to a local run.
      - name: Package smoke
        run: node tools/pack-smoke.mjs
