name: harness-matrix

# Complement offline manifest checks with latest dist-tag membership: an unlisted
# latest fails even if older; RC and other dist-tags remain outside this check.
# RELEASE.md owns the review and dogfood required before changing the verified list.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# Report registry drift without authority to update source or declare new releases verified.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This diagnostic needs no reusable Git credentials after checkout.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Harness release drift
        run: node tools/harness-matrix.mjs --check-registry
