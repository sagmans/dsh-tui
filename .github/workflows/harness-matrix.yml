name: harness-matrix

# The matrix is checked offline in verify; this run is the registry half. A
# harness release that moves past dsh.compatibility.dshReleases fails here on
# schedule, so the bump RELEASE.md owns happens before a release needs it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Harness release drift
        run: node tools/harness-matrix.mjs --check-registry
