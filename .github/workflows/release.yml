name: release

# Publication is a tag, not a laptop: provenance is an OIDC attestation that only
# a CI provider can issue, so the artefact users install is the one this workflow
# built and verified. No npm token is stored anywhere.
on:
  push:
    tags: ['v*']

# Least privilege: the verify job only reads source, and the publish job
# re-declares the id-token scope it needs for npm OIDC trusted publishing.
permissions:
  contents: read

# pnpm can link a skipped optional package to the project root with the isolated
# layout, so npm would audit the project version under that dependency name.
env:
  PNPM_NODE_LINKER: hoisted

jobs:
  verify:
    name: Verify release candidate
    # Bound runner time if installation or candidate verification stalls before publication.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # Commit pins prevent a moved action tag from changing the release machinery.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs need source access, not reusable Git credentials in later steps.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Verify the candidate on the publisher's runtime as well as Node 22 in main/PR CI.
          # An exact patch, not the runner's cached '24', so the release never
          # verifies or publishes on a Node 24 build that lacks security fixes.
          # Both jobs move together with each Node 24 security release.
          node-version: '24.22.1'
          # A release must not restore state another run saved: a poisoned
          # dependency store would run inside the verified and published build.
          # Every release installs from the registry against the reviewed lockfile.
          package-manager-cache: false
      # Reject resolution drift from the reviewed lockfile before building the release artefact.
      - run: pnpm install --frozen-lockfile --config.node-linker="$PNPM_NODE_LINKER"
      # The released artefact is built from this tree, so its registry signatures
      # are checked before the tag can reach the publish job.
      - name: Dependency signatures
        run: npm audit signatures
      # RELEASE.md requires the tag and package.json version to match; fail the
      # release before a mismatched publish can happen.
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # These tag gates complement exact-merged-SHA verify required by RELEASE.md;
      # terminal, matrix and consumer-install gates remain that pre-tag prerequisite.
      - run: pnpm typecheck
      - run: pnpm test:golden
      - run: pnpm test:terminal
      # Real profile checks reuse the verified host release; no global installation or credentials.
      - name: Install dogfood host
        run: |
          version="$(node -p 'Object.keys(require("./package.json").dsh.compatibility.dshReleases)[0]')"
          npm install --prefix "$RUNNER_TEMP/dsh-dogfood-host" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@$version"
          npm audit signatures --prefix "$RUNNER_TEMP/dsh-dogfood-host"
      - name: Free actual-profile dogfood
        run: pnpm dogfood --launcher "$RUNNER_TEMP/dsh-dogfood-host/node_modules/.bin/dsh"
      - run: node tools/pack-smoke.mjs

  publish:
    name: Publish to npm
    needs: verify
    # npm requires a package to exist before trusted publishing can be
    # configured, so the first tag is verified here and bootstrapped by hand
    # per RELEASE.md.
    if: github.ref_name != 'v0.1.0'
    runs-on: ubuntu-latest
    # Bind publication to npm-release: npm trusts only this environment, and the environment
    # admits only v* tags, which the admin-only ruleset lets administrators alone push. The
    # signed tag push is therefore the release approval; no reviewer waits here (RELEASE.md).
    environment: npm-release
    # Bound runner time if release installation or the registry publish stalls; timeout is not rollback.
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Mints the OIDC token npm exchanges for a short-lived publish credential.
    steps:
      # Commit pins prevent a moved action tag from changing the release machinery.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # These jobs need source access, not reusable Git credentials in later steps.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
          # The job holds the publish credential, so it never restores a cache
          # another run could have written, even if packageManager is added later.
          package-manager-cache: false
      # devDependencies supply tsc for the prepack build that npm publish runs.
      # Reject resolution drift from the reviewed lockfile before building the release artefact.
      - run: pnpm install --frozen-lockfile --config.node-linker="$PNPM_NODE_LINKER"
      # --provenance keeps the attestation explicit and fails loudly if the
      # trusted-publisher match is misconfigured. zizmor's use-trusted-publishing
      # cannot see that this npm publish already authenticates through OIDC
      # trusted publishing (id-token above, no stored token), so it is ignored here.
      - run: npm publish --provenance --access public # zizmor: ignore[use-trusted-publishing]
